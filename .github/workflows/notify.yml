# Déclenche l'envoi des notifications (rappel quotidien + mots surprise) toutes les 10 minutes.
# Réglage : dans le dépôt GitHub → Settings → Secrets and variables → Actions → New repository secret
#   CRON_SECRET = la même valeur que la variable CRON_SECRET de Vercel
# (facultatif) Variables → SITE_URL si l'adresse du site change.
name: Notifications

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/notify
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://gremlin-tawny.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Secret CRON_SECRET manquant"; exit 1; fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/notify"
